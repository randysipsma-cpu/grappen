name: Verwerk Grappenmaker afbeeldingen
on:
  push:
    paths:
      - 'grappen-30-afbeeldingen.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verwerk-afbeeldingen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Afbeeldingen uitpakken
        shell: bash
        run: |
          set -euo pipefail
          test -f grappen-30-afbeeldingen.zip
          mkdir -p images
          unzip -o grappen-30-afbeeldingen.zip 'images/aflevering-*.jpg' -d .
          count=$(find images -maxdepth 1 -name 'aflevering-*.jpg' | wc -l)
          echo "Aantal afbeeldingen: $count"
          test "$count" -eq 30
      - name: Afbeeldingen opslaan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/aflevering-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Voeg 30 Grappenmaker-afbeeldingen toe"
            git push
          fi
